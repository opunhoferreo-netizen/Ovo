<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>estudando</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  a.thumb {
    position: relative;
    display: block;
    width: 80%;
    max-width: 800px;
  }
  a.thumb img {
    width: 100%;
    display: block;
  }
  a.thumb::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 68px;
    height: 48px;
    margin: -24px 0 0 -34px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
  }
  a.thumb::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    margin: -12px 0 0 -8px;
    border-style: solid;
    border-width: 12px 0 12px 20px;
    border-color: transparent transparent transparent #ffffff;
    z-index: 1;
  }
</style>
</head>
<body>
<a class="thumb" href="https://www.youtube.com/watch?v=0jM4D_1AEQ8" target="_blank" rel="noopener">
  <img src="https://img.youtube.com/vi/0jM4D_1AEQ8/hqdefault.jpg" alt="video">
</a>
</body>
</html>
